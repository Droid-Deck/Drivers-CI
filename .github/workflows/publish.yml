name: Publish

on:
  push:
    tags: ['DD-Turnip-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --quiet --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents)' "$TAG" > notes.md
          sha256sum -c "$TAG.zip.sha256"
          gh release create "$TAG" "$TAG.zip" "$TAG.zip.sha256" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "DD-Turnip ${TAG#DD-Turnip-v}" --notes-file notes.md --latest
